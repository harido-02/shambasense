# Local stack: PostgreSQL + the ShambaSense API and web app on http://localhost:8000
#   docker compose up -d
#   docker compose exec app python -m shambasense.cli ingest-live
#   docker compose exec app python -m shambasense.cli load-yields data/raw/kilimostat.csv --format kilimostat
#   docker compose exec app python -m shambasense.cli train
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: shamba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: shambasense
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shamba -d shambasense"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://shamba:${POSTGRES_PASSWORD:-change-me}@db:5432/shambasense
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports

volumes:
  pgdata:
