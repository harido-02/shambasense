name: Fetch open data
# Downloads NASA POWER daily weather and SoilGrids topsoil for the study counties (and WFP market
# prices from HDX) and commits them to data/real/, which the server trains and advises from.
# Run it from the Actions tab, or push a change to data/real/REFRESH.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch-data.yml", "data/real/REFRESH"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weather (NASA POWER) and soil (SoilGrids)
        env:
          DATABASE_URL: sqlite:////tmp/fetch.db
        run: |
          python -m shambasense.cli init-db
          python -m shambasense.cli ingest-live
          python -m shambasense.cli export-data
      - name: Market prices (WFP, via HDX)
        continue-on-error: true
        run: python scripts/fetch_wfp_prices.py data/real/wfp_food_prices_kenya.csv
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/real
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Data: refresh open data snapshot [skip ci]"
          git push
