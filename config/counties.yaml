# Study counties. Coordinates are APPROXIMATE town locations used as reference
# points for weather and soil sampling; check them on a map before final runs.
#
# seasons:
#   months          growing months, used to label the season
#   outlook_months  the months a KMD seasonal outlook covers (MAM, OND ...)
#   onset_start     month and day from which the onset of rains is searched
# main_season: season used when yields are reported for the whole year
#   (KilimoSTAT reports calendar-year totals).

counties:
  trans_nzoia:
    name: Trans Nzoia
    lat: 1.016
    lon: 35.006
    reference_points:        # Kitale, Endebess, Kiminini
      - [1.016, 35.006]
      - [1.080, 34.850]
      - [0.890, 34.920]
    main_season: long_rains
    seasons:
      long_rains: {months: [3, 4, 5, 6, 7, 8, 9], outlook_months: [3, 4, 5], onset_start: "03-01"}
    markets: [Kitale]

  nakuru:
    name: Nakuru
    lat: -0.303
    lon: 36.080
    reference_points:        # Nakuru town, Njoro, Molo
      - [-0.303, 36.080]
      - [-0.330, 35.940]
      - [-0.249, 35.732]
    main_season: long_rains
    seasons:
      long_rains: {months: [3, 4, 5, 6, 7, 8], outlook_months: [3, 4, 5], onset_start: "03-01"}
      short_rains: {months: [10, 11, 12], outlook_months: [10, 11, 12], onset_start: "10-01"}
    markets: [Nakuru, Molo]

  meru:
    name: Meru
    lat: 0.046
    lon: 37.656
    reference_points:        # Meru town, Nkubu, Maua
      - [0.046, 37.656]
      - [-0.066, 37.667]
      - [0.233, 37.940]
    main_season: long_rains
    seasons:
      long_rains: {months: [3, 4, 5, 6], outlook_months: [3, 4, 5], onset_start: "03-01"}
      short_rains: {months: [10, 11, 12], outlook_months: [10, 11, 12], onset_start: "10-01"}
    markets: [Meru, Nkubu]

  machakos:
    name: Machakos
    lat: -1.518
    lon: 37.263
    reference_points:        # Machakos town, Katumani, Kangundo
      - [-1.518, 37.263]
      - [-1.580, 37.240]
      - [-1.300, 37.350]
    # In semi-arid eastern Kenya the short rains are usually the more reliable season.
    main_season: short_rains
    seasons:
      long_rains: {months: [3, 4, 5], outlook_months: [3, 4, 5], onset_start: "03-01"}
      short_rains: {months: [10, 11, 12], outlook_months: [10, 11, 12], onset_start: "10-01"}
    markets: [Machakos]
